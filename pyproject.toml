[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecture-transcribe"
version = "0.1.3"
description = "Local lecture/video speech-to-text CLI for Apple Silicon (ffmpeg + mlx-whisper)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Nestor Pestelos", email = "ngpestelos@me.com" },
]
keywords = [
  "whisper",
  "mlx",
  "transcription",
  "speech-to-text",
  "apple-silicon",
  "lecture",
  "ffmpeg",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "mlx-whisper>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ngpestelos/transcribe"
Repository = "https://github.com/ngpestelos/transcribe"
Issues = "https://github.com/ngpestelos/transcribe/issues"
Changelog = "https://github.com/ngpestelos/transcribe/blob/main/CHANGELOG.md"

[project.scripts]
transcribe = "transcribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
