name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs. Branch protection on `main` still
# gates the merge: the PR only lands once required CI checks pass and the
# branch is up to date. A bump that breaks CI stays open.
#
# mlx-whisper is excluded below (never auto-merged): it's the repo's only
# direct dependency and the sole component that executes untrusted native/
# model-loading code. Grouping in dependabot.yml does NOT gate this — this
# job auto-merges every Dependabot PR regardless of group, so the exclusion
# has to live here, on the actual merge step. See ngpestelos/transcribe#6.
#
# Hold major bumps for manual review: add
#   && steps.meta.outputs.update-type != 'version-update:semver-major'
# to the Enable auto-merge step condition if you want that gate.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: ${{ !contains(steps.meta.outputs.dependency-names, 'mlx-whisper') }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
