name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install package (no heavy runtime deps)
        # mlx-whisper pulls torch/mlx and is Apple Silicon–oriented.
        # Unit tests only need the package + pytest (pipeline shells out to mlx_whisper).
        # See the mlx-smoke job below for the job that actually installs and
        # imports mlx_whisper on a real Apple Silicon runner.
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install -e ".[dev]" --no-deps
          uv pip install pytest

      - name: Test
        run: |
          source .venv/bin/activate
          pytest -q

      - name: CLI smoke (no Apple Silicon / no model)
        run: |
          source .venv/bin/activate
          transcribe --version
          # --check must fail off macOS arm64; assert the hard gate works
          if transcribe --check; then
            echo "expected --check to fail on ubuntu" >&2
            exit 1
          fi

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: |
          uv python install 3.11
          uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Real Apple-Silicon canary for the repo's only direct (and only
  # untrusted-native-code) dependency. Proves a just-bumped mlx-whisper
  # release still installs and its CLI resolves/runs — the exact path
  # pipeline.py's resolve_mlx_whisper()/run_mlx_whisper() use at runtime —
  # before that bump can reach ci-success. One Python version is enough;
  # this is a canary, not full matrix coverage. No model download/inference:
  # `--help` proves import + CLI wiring without touching a model.
  #
  # runs-on is pinned to macos-15, not macos-14: macos-14 begins deprecation
  # 2026-07-06 and is fully retired 2026-11-02 (actions/runner-images#13518).
  # Empirically verified 2026-08-11 on a real macos-15 GitHub-hosted runner
  # (run 31543457099): mlx_whisper 0.4.3 imports and its CLI runs cleanly —
  # the standard runner does NOT hit the Metal-init crash some no-GPU/
  # virtualized environments hit (ml-explore/mlx#3148). Re-verify if this job
  # ever starts failing across-the-board (all Dependabot AND non-Dependabot
  # runs) — that pattern means the runner environment changed, not that a
  # bump is bad.
  mlx-smoke:
    name: mlx-smoke (macOS arm64)
    runs-on: macos-15
    # Explicit read-only, even though it's already inherited from the
    # top-level `permissions:` block: this job runs real import-time code
    # from a Dependabot-controlled mlx-whisper release, so its isolation
    # from the write-scoped dependabot-auto-merge.yml workflow (separate
    # file, separate token) should be self-evident to future editors.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package with mlx-whisper
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e .

      - name: mlx_whisper import + CLI smoke
        run: |
          source .venv/bin/activate
          python -c "import mlx_whisper; print('mlx_whisper import OK:', getattr(mlx_whisper, '__version__', 'unknown'))"
          mlx_whisper --help >/dev/null
          echo "mlx_whisper CLI OK"

  # Single required check for branch protection + Dependabot auto-merge.
  ci-success:
    name: ci-success
    if: always()
    needs: [test, package, mlx-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
          test "${{ needs.mlx-smoke.result }}" = "success"
